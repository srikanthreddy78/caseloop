# Fly.io deployment. First time:
#   fly launch --no-deploy --copy-config
#   fly postgres create && fly postgres attach <pg-app>   # sets DATABASE_URL
#   fly secrets set CASELOOP_DATABASE_URL="postgresql+asyncpg://..." OPENAI_API_KEY=... RESEND_API_KEY=... DIAL_API_KEY=...
#   fly volumes create caseloop_data --size 1
#   fly deploy
# The scheduler runs inside the API process, so the machine must not auto-stop.

app = "caseloop"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "alembic upgrade head"
  strategy = "rolling"

[env]
  CASELOOP_ENV = "prod"
  CASELOOP_DATA_DIR = "/data"
  PORT = "8000"
  # Fly's edge proxy is the only way in, so its X-Forwarded-For is trusted for client IPs.
  FORWARDED_ALLOW_IPS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "caseloop_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
