[project]
name = "caseloop"
version = "0.1.0"
description = "Autonomous customer-issue resolution: ingests complaints over email, chat, SMS and voice, follows up until resolved, and reports insights to the business."
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = { text = "MIT" }
authors = [{ name = "Srikanth Reddy Gondireddy" }]
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
  "pydantic[email]>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "openai>=3.29,<4",
  "resend>=2.49,<3",
  "svix>=2.8,<3",
  "dial-sdk>=0.40,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
  "mypy>=1.14,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501", "RUF012", "SIM108", "SIM105", "B008", "RUF001", "RUF002", "RUF003", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/**" = ["E402", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
